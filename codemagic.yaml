# Codemagic CI/CD for ForeAi — ONE codebase, TWO apps.
#
# There are no committed native projects: `expo prebuild` regenerates the
# android/ and ios/ folders in CI from mobile/app.config.js. Which app you get
# is chosen by EXPO_PUBLIC_APP_VARIANT:
#     (unset / "full")  → "ForeAi"        com.foreai.mobile
#     "event"           → "ECS Golf Day"  com.foreai.event
#
# ── WORKFLOWS ──  (Codemagic → Start new build → pick one)
#   foreai-android        ForeAi        → app-release.apk   (sideloadable, no setup)
#   ecs-golfday-android   ECS Golf Day  → app-release.apk   (hand out on the day)
#   foreai-ios            ForeAi        → TestFlight / .ipa  (needs Apple setup*)
#   ecs-golfday-ios       ECS Golf Day  → TestFlight / .ipa  (needs Apple setup*)
#
# ── * ONE-TIME iOS SETUP (only for the two *-ios workflows) ──
#   1. In Codemagic: Teams (or your personal account) → Integrations →
#      App Store Connect → Connect, and upload an App Store Connect API key
#      (App Store Connect → Users and Access → Integrations → create a key with
#       the "App Manager" role). Give the integration a NAME.
#   2. Put that exact name below in each *-ios workflow under
#      `integrations: app_store_connect:` (it currently says "ForeAi ASC").
#   3. Run the workflow once. Codemagic auto-creates the bundle IDs
#      (com.foreai.mobile / com.foreai.event) and provisioning profiles, builds
#      a signed .ipa, and uploads it to TestFlight. (If the App Store Connect
#      app record doesn't exist yet, create it once at appstoreconnect.apple.com
#      with the matching bundle ID, then re-run.)
#   Android needs NO setup — the APK is signed with the debug keystore and
#   installs on any phone once "install unknown apps" is allowed.

workflows:
  # ─────────────────────────── ANDROID ───────────────────────────
  foreai-android:
    name: ForeAi — Android APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      vars:
        EXPO_PUBLIC_APP_VARIANT: "full"
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - name: Install JS dependencies
        script: |
          cd mobile
          npm install
      - name: Generate native Android project (expo prebuild)
        script: |
          cd mobile
          npx expo prebuild --platform android --no-install
      - name: Build release APK
        script: |
          cd mobile/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
    artifacts:
      - mobile/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - mpower333is@gmail.com
        notify:
          success: true
          failure: true

  ecs-golfday-android:
    name: ECS Golf Day — Android APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      vars:
        EXPO_PUBLIC_APP_VARIANT: "event"
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - name: Install JS dependencies
        script: |
          cd mobile
          npm install
      - name: Generate native Android project (expo prebuild)
        script: |
          cd mobile
          npx expo prebuild --platform android --no-install
      - name: Build release APK
        script: |
          cd mobile/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
    artifacts:
      - mobile/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - mpower333is@gmail.com
        notify:
          success: true
          failure: true

  # ───────────────────────────── iOS ─────────────────────────────
  foreai-ios:
    name: ForeAi — iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: ForeAi ASC   # your Codemagic App Store Connect integration
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        EXPO_PUBLIC_APP_VARIANT: "full"
        BUNDLE_ID: "com.foreai.mobile"
    scripts:
      - name: Install JS dependencies
        script: |
          cd mobile
          npm install
      - name: Generate native iOS project (expo prebuild)
        script: |
          cd mobile
          npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: |
          cd mobile/ios
          pod install
      - name: Set up code signing (creates the cert + profile if missing)
        script: |
          set -e
          keychain initialize
          # Generate a PKCS#8 RSA private key — the format the CLI accepts.
          # `openssl genrsa` alone emits PKCS#1, which the tool silently ignores
          # → "Cannot create resource without certificate private key".
          CERT_KEY=/tmp/ios_distribution_key.pem
          openssl genrsa 2048 | openssl pkcs8 -topk8 -nocrypt -out "$CERT_KEY"
          echo "Private key: $(wc -c < "$CERT_KEY") bytes"
          # Create the iOS distribution certificate (from this key) AND the App
          # Store provisioning profile for $BUNDLE_ID, saving both so we can sign.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$CERT_KEY" \
            --create
          keychain add-certificates
          # Run from mobile/ios so use-profiles configures THIS Xcode project
          # (the app lives in a monorepo subfolder, not the repo root).
          cd mobile/ios
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd mobile/ios
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          cd mobile/ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - mpower333is@gmail.com
        notify:
          success: true
          failure: true

  ecs-golfday-ios:
    name: ECS Golf Day — iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: ForeAi ASC   # your Codemagic App Store Connect integration
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        EXPO_PUBLIC_APP_VARIANT: "event"
        BUNDLE_ID: "com.foreai.event"
    scripts:
      - name: Install JS dependencies
        script: |
          cd mobile
          npm install
      - name: Generate native iOS project (expo prebuild)
        script: |
          cd mobile
          npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: |
          cd mobile/ios
          pod install
      - name: Set up code signing (creates the cert + profile if missing)
        script: |
          set -e
          keychain initialize
          # Generate a PKCS#8 RSA private key — the format the CLI accepts.
          # `openssl genrsa` alone emits PKCS#1, which the tool silently ignores
          # → "Cannot create resource without certificate private key".
          CERT_KEY=/tmp/ios_distribution_key.pem
          openssl genrsa 2048 | openssl pkcs8 -topk8 -nocrypt -out "$CERT_KEY"
          echo "Private key: $(wc -c < "$CERT_KEY") bytes"
          # Create the iOS distribution certificate (from this key) AND the App
          # Store provisioning profile for $BUNDLE_ID, saving both so we can sign.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$CERT_KEY" \
            --create
          keychain add-certificates
          # Run from mobile/ios so use-profiles configures THIS Xcode project
          # (the app lives in a monorepo subfolder, not the repo root).
          cd mobile/ios
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd mobile/ios
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          cd mobile/ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
    artifacts:
      - mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - mpower333is@gmail.com
