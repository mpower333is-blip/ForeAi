# Codemagic CI/CD for ForeAi — ONE codebase, ONE app for iOS and Android
# (com.foreai.mobile).
#
# There are no committed native projects: `expo prebuild` regenerates the
# android/ and ios/ folders in CI from mobile/app.config.js.
#
# ── WORKFLOWS ──  (Codemagic → Start new build → pick one)
#   foreai-android-play    ForeAi phone → app-release.aab   (Play Store + RevenueCat)
#   foreai-watch-android   ForeAi watch → app-release.aab   (Wear OS form factor)
#   foreai-ios             ForeAi phone → TestFlight / .ipa (needs Apple setup*)
#
# The phone and watch are ONE Play app (com.foreai.mobile). In Play you choose
# the form factor — "mobile" or "Wear OS" — per release, and upload the matching
# bundle. Both bundles carry the SAME package (com.foreai.mobile), so their
# versionCodes must be unique: the watch build offsets its code into the 90000+
# range so it never collides with the phone's low numbers. Play does NOT generate
# the watch from the phone build — you build and upload each bundle yourself.
#
# (The keystore generator and the sideload-APK workflow were removed once the
#  Play upload keystore was set up — the app now ships through Play.)
#
# ── * ONE-TIME iOS SETUP (foreai-ios only) ──
#   1. In Codemagic: Teams (or your personal account) → Integrations →
#      App Store Connect → Connect, and upload an App Store Connect API key
#      (App Store Connect → Users and Access → Integrations → create a key with
#       the "App Manager" role). Give the integration a NAME.
#   2. Put that exact name below in the foreai-ios workflow under
#      `integrations: app_store_connect:` (it currently says "ForeAi ASC").
#   3. Run the workflow once. Codemagic auto-creates the bundle ID
#      (com.foreai.mobile) and provisioning profile, builds a signed .ipa, and
#      uploads it to TestFlight. (If the App Store Connect app record doesn't
#      exist yet, create it once at appstoreconnect.apple.com with the matching
#      bundle ID, then re-run.)
#   Android needs NO setup — the APK is signed with the debug keystore and
#   installs on any phone once "install unknown apps" is allowed.

workflows:
  # ───────────────── ANDROID — Play Store (signed AAB) ────────────
  # Produces a Play-signed .aab for Google Play (Play Billing / RevenueCat need
  # the app distributed through Play). Needs a `google_play` env group with:
  #   CM_KEYSTORE            base64 of your upload keystore  (see setup guide)
  #   CM_KEYSTORE_PASSWORD   keystore password
  #   CM_KEY_ALIAS           key alias
  #   CM_KEY_PASSWORD        key password
  #   EXPO_PUBLIC_RC_ANDROID_KEY   RevenueCat Android SDK key (goog_…)
  # Upload the .aab to Play Console (Internal testing). Full walkthrough:
  #   store/android/play-revenuecat-setup.md
  foreai-android-play:
    name: ForeAi — Android AAB (Play + RevenueCat)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      groups:
        - google_play
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - name: Install JS dependencies
        script: |
          cd mobile
          npm install
      - name: Generate native Android project (expo prebuild)
        script: |
          cd mobile
          # Phone versionCodes live in the 1000+ lane: clear of the low numbers
          # burned during watch testing, and far below the watch's 90000+ range,
          # so the two form factors never collide in the shared com.foreai.mobile app.
          export ANDROID_VERSION_CODE=$((1000 + ${BUILD_NUMBER:-1}))
          echo "=================================================="
          echo "  PHONE versionCode for this build: $ANDROID_VERSION_CODE"
          echo "  (upload this .aab to Play — it must be higher than the last phone upload)"
          echo "=================================================="
          npx expo prebuild --platform android --no-install
      - name: Decode the upload keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/mobile/android/app/upload.keystore"
      - name: Build the signed AAB
        script: |
          cd mobile/android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/upload.keystore" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - mobile/android/app/build/outputs/**/*.aab
    publishing:
      # No auto-publish. The phone and watch share one Play listing, and every
      # release must contain BOTH AABs, so releases are done manually: this build
      # just emails you the signed phone .aab. Upload it to Play → Test and
      # release → [track] → new release, together with the current watch .aab.
      # (The `google_play` env group above is still used — it holds the signing
      #  keystore; only the service-account auto-upload was removed.)
      email:
        recipients:
          - mpower333is@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────── WEAR OS ───────────────────────────
  # Builds the Wear OS watch app (../wear) into a Play-signed release .aab. The
  # watch ships inside the SAME Play app as the phone (applicationId
  # com.foreai.mobile) as its **Wear OS form factor** — in Play you pick "Wear OS"
  # when creating the release and upload this bundle. Reuses the same upload
  # keystore as the phone via the `google_play` env group.
  #
  # Its versionCode is offset into the 90000+ range so it stays unique against the
  # phone's low numbers in the shared app. Steps: wear/README.md → "Publish to Play".
  foreai-watch-android:
    name: ForeAi Watch — Wear OS AAB (Play)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - google_play   # CM_KEYSTORE (+ password/alias) — the shared upload key
    cache:
      cache_paths:
        - $HOME/.gradle/caches
    scripts:
      - name: Build the signed Wear OS release AAB
        script: |
          cd wear
          # Offset the versionCode into the 90000+ range so every upload sits
          # above any code already used in the Play app (low numbers like 1 were
          # already consumed). Each rebuild bumps BUILD_NUMBER, so it keeps rising.
          export ANDROID_VERSION_CODE=$((90000 + ${BUILD_NUMBER:-1}))
          echo "=================================================="
          echo "  WATCH versionCode for this build: $ANDROID_VERSION_CODE"
          echo "  (Wear OS form factor — its own 90000+ lane, separate from the phone)"
          echo "=================================================="
          # Decode the shared upload keystore (same key the phone app is signed
          # with — one upload key can sign multiple apps).
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/wear/upload.keystore"
          # The wear project has no committed Gradle wrapper jar; fetch the
          # pinned Gradle (8.7, matching gradle-wrapper.properties) and build.
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d "$HOME/gradle-dist"
          "$HOME/gradle-dist/gradle-8.7/bin/gradle" :app:bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$CM_BUILD_DIR/wear/upload.keystore" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
    artifacts:
      - wear/app/build/outputs/**/*.aab
    publishing:
      # No auto-publish (see note above): the watch AAB is emailed to you and
      # uploaded manually into the com.foreai.mobile release beside the phone AAB.
      email:
        recipients:
          - mpower333is@gmail.com
        notify:
          success: true
          failure: true

  # ───────────────────────────── iOS ─────────────────────────────
  foreai-ios:
    name: ForeAi — iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: ForeAi ASC   # your Codemagic App Store Connect integration
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing   # Codemagic group holding IOS_DIST_KEY (+ optional EXPO_PUBLIC_RC_IOS_KEY)
      vars:
        BUNDLE_ID: "com.foreai.mobile"
    scripts:
      - name: Install JS dependencies
        script: |
          cd mobile
          npm install
      - name: Generate native iOS project (expo prebuild)
        script: |
          cd mobile
          npx expo prebuild --platform ios --no-install
      - name: Patch Podfile for Xcode 26 (build fmt as C++17)
        script: |
          cd mobile/ios
          if ! grep -q "ci-fmt-cxx17-fix" Podfile; then
            awk '
              /post_install do \|installer\|/ && !done {
                print
                print "    # ci-fmt-cxx17-fix: fmt fails on Xcode 26 (consteval); build it as C++17."
                print "    installer.pods_project.targets.each do |t|"
                print "      if t.name == \"fmt\""
                print "        t.build_configurations.each do |c|"
                print "          c.build_settings[\"CLANG_CXX_LANGUAGE_STANDARD\"] = \"c++17\""
                print "          d = c.build_settings[\"GCC_PREPROCESSOR_DEFINITIONS\"] || [\"$(inherited)\"]"
                print "          d = [d] unless d.is_a?(Array)"
                print "          d << \"FMT_USE_CONSTEVAL=0\" unless d.include?(\"FMT_USE_CONSTEVAL=0\")"
                print "          c.build_settings[\"GCC_PREPROCESSOR_DEFINITIONS\"] = d"
                print "          f = c.build_settings[\"OTHER_CPLUSPLUSFLAGS\"] || [\"$(inherited)\"]"
                print "          f = [f] unless f.is_a?(Array)"
                print "          f << \"-DFMT_USE_CONSTEVAL=0\" unless f.include?(\"-DFMT_USE_CONSTEVAL=0\")"
                print "          c.build_settings[\"OTHER_CPLUSPLUSFLAGS\"] = f"
                print "        end"
                print "      end"
                print "    end"
                done=1
                next
              }
              { print }
            ' Podfile > Podfile.new && mv Podfile.new Podfile
            echo "PATCHED Podfile with fmt C++17 fix"
          else
            echo "fmt C++17 fix already present"
          fi
          echo "----- Podfile fmt section -----"
          grep -n "ci-fmt-cxx17-fix\|CLANG_CXX_LANGUAGE_STANDARD\|FMT_USE_CONSTEVAL" Podfile || echo "NONE"
      - name: Install CocoaPods
        script: |
          cd mobile/ios
          pod install
      - name: Disable fmt consteval for Xcode 26
        script: |
          cd mobile/ios
          echo "fmt consteval BEFORE:"; grep -rn "define FMT_USE_CONSTEVAL" Pods/fmt 2>/dev/null || echo "(none)"
          # Xcode 26's clang mis-handles fmt's consteval path. Force the macro OFF
          # directly in fmt's source so it uses runtime format checking instead.
          find Pods/fmt -type f \( -name "*.h" -o -name "*.cc" \) -exec sed -i '' 's/define FMT_USE_CONSTEVAL 1/define FMT_USE_CONSTEVAL 0/g' {} + 2>/dev/null || \
            find Pods/fmt -type f \( -name "*.h" -o -name "*.cc" \) -exec sed -i 's/define FMT_USE_CONSTEVAL 1/define FMT_USE_CONSTEVAL 0/g' {} +
          echo "fmt consteval AFTER:"; grep -rn "define FMT_USE_CONSTEVAL" Pods/fmt 2>/dev/null || echo "(none)"
      - name: Set up code signing (creates the cert + profile if missing)
        script: |
          set -e
          keychain initialize
          # Reuse ONE persistent distribution certificate across every build and
          # BOTH apps, so a build never revokes a cert that an already-uploaded
          # binary was signed with — that churn caused ITMS-90035 Invalid Signature.
          # IOS_DIST_KEY is the base64 of a PKCS#8 private key (a Codemagic secure
          # env var). fetch-signing-files reuses the certificate matching this key,
          # or creates it once. No per-build create/delete of certificates.
          #
          # HARD GUARD: without a pinned key, fetch-signing-files mints a throwaway
          # cert every run and the previous cert is revoked — every already-uploaded
          # build then fails ITMS-90035 at review time. Fail loudly instead of
          # churning: set IOS_DIST_KEY once and the cert is stable forever.
          if [ -z "$IOS_DIST_KEY" ]; then
            echo "ERROR: IOS_DIST_KEY is not set in the ios_signing env group."
            echo "Every build would create a new distribution certificate and revoke"
            echo "the last one, so previously-uploaded builds fail ITMS-90035 Invalid"
            echo "Signature. Set IOS_DIST_KEY (base64 of a PKCS#8 distribution private"
            echo "key) as a SECURE env var in the ios_signing group, then rebuild once."
            exit 1
          fi
          CERT_KEY=/tmp/ios_distribution_key.pem
          echo "$IOS_DIST_KEY" | openssl base64 -d -A > "$CERT_KEY"
          echo "Private key: $(wc -c < "$CERT_KEY") bytes"
          openssl pkey -in "$CERT_KEY" -noout 2>/dev/null || { echo "ERROR: IOS_DIST_KEY did not decode to a valid private key."; exit 1; }
          fetch_signing() {
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --platform IOS \
              --type IOS_APP_STORE \
              --certificate-key=@file:"$CERT_KEY" \
              --api-server-error-retries 10 \
              --create
          }
          # Normally this reuses our persistent cert. Only on the very first run —
          # when our cert doesn't exist yet AND the account is already at Apple's
          # 2-cert cap with old orphaned certs — do we clear those orphans once and
          # retry. Once our cert exists it is always reused, so this never revokes it.
          if ! fetch_signing; then
            echo "== Cert missing and cap reached — clearing orphaned distribution certs once =="
            app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION --json > /tmp/certs.json 2>/dev/null || true
            for CID in $(jq -r '(if type=="object" and has("data") then .data else . end)[]?.id // empty' /tmp/certs.json 2>/dev/null); do
              echo "Deleting orphaned distribution cert $CID"
              app-store-connect certificates delete "$CID" --ignore-not-found || true
            done
            fetch_signing
          fi
          keychain add-certificates
          # Run from mobile/ios so use-profiles configures THIS Xcode project
          # (the app lives in a monorepo subfolder, not the repo root).
          cd mobile/ios
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd mobile/ios
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          cd mobile/ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          set +e
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "=================== ACTUAL COMPILER ERRORS ==================="
            grep -rhE "error:|error :" /tmp/xcodebuild_logs/ 2>/dev/null | tail -50
            echo "============================================================="
          fi
          exit $RC
      - name: Verify the IPA is distribution-signed (pre-empt ITMS-90035)
        script: |
          cd mobile/ios
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA: $IPA"
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name "*.app" | head -1)
          echo "===== codesign authorities ====="
          codesign -dvvv "$APP" 2>&1 | grep -i "^Authority=" || true
          # App Store binaries must be signed by an "Apple/iPhone Distribution"
          # cert. A development or ad-hoc cert is what triggers ITMS-90035 on
          # upload — catch it here and fail the build instead of days later.
          if codesign -dvvv "$APP" 2>&1 | grep -qiE "^Authority=(Apple|iPhone) Distribution"; then
            echo "OK: IPA is distribution-signed."
          else
            echo "ERROR: IPA is NOT distribution-signed — Apple would reject it as ITMS-90035."
            echo "Check that IOS_DIST_KEY is an Apple Distribution key and use-profiles applied the App Store profile."
            exit 1
          fi
    artifacts:
      - mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - mpower333is@gmail.com
        notify:
          success: true
          failure: true
