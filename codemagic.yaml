# Codemagic CI/CD for ForeAi — ONE codebase, two app flavours, two platforms.
#
# There are no committed native projects: `expo prebuild` regenerates the
# android/ and ios/ folders in CI from mobile/app.config.js.
#
# ── THE 4 STORE WORKFLOWS ──  (Codemagic → Start new build → pick one)
#   foreai-android-play    ForeAi   → ForeAi-Phone-*.aab      (Play, com.foreai.mobile)
#   foreai-kempton-android Kempton  → ForeAi-Kempton-*.aab    (Play, com.foreai.kempton)
#   foreai-ios             ForeAi   → TestFlight / .ipa       (com.foreai.mobile)
#   foreai-kempton-ios     Kempton  → TestFlight / .ipa       (com.foreai.kempton)
#
# Both Android AABs are signed with the SAME upload keystore (one upload key can
# sign several Play apps) via the `google_play` env group. Each package
# (com.foreai.mobile, com.foreai.kempton) is its OWN Play listing — create the
# Kempton listing once in Play Console with package com.foreai.kempton, then
# upload its .aab.
#
# Both iOS apps share ONE persistent distribution certificate (IOS_DIST_KEY in the
# `ios_signing` group) so a build never revokes a cert an uploaded binary used
# (ITMS-90035). Each bundle id (com.foreai.mobile, com.foreai.kempton) needs its
# own App Store Connect app record — create it once at appstoreconnect.apple.com
# with the matching bundle id, then run the workflow (it creates the bundle id +
# profile and uploads to TestFlight).
#
# Plus non-store, sideloadable APK builds:
#   foreai-surveyor-android        ForeAi Survey → ForeAi-Survey-*.apk
#                                  (com.foreai.surveyor — the course-survey tool)
#   foreai-firestore-apk           ForeAi → ForeAi-Firestore-*.apk, built with
#                                  EXPO_PUBLIC_USE_FIRESTORE=1 (events on Firestore).
#                                  Same package id → UPDATES the sideloaded app in
#                                  place. Deploy firestore.rules first.
#   foreai-kempton-firestore-apk   Kempton → Kempton-Firestore-*.apk, Firestore on
#                                  for events AND club data. Same package id, in place.
#
#   foreai-watch-android           Wear OS AAB (ForeAi-Watch-*.aab) for the watch
#                                  form factor of com.foreai.mobile. The wear/ app
#                                  now runs on Firestore (no Render), so scores on
#                                  the watch land on the same live leaderboard.
#                                  Emailed to you; upload beside the phone AAB.
#
# ── ONE-TIME iOS SETUP ──
#   In Codemagic → Teams → Integrations → App Store Connect → connect an API key
#   (App Store Connect → Users and Access → Integrations → key with "App Manager"
#   role) and NAME it. Put that name under `integrations: app_store_connect:` in
#   BOTH iOS workflows (currently "ForeAi ASC"). Set IOS_DIST_KEY (base64 of a
#   PKCS#8 Apple Distribution private key) in the `ios_signing` group.

workflows:
  # ═══════════════ 1) ForeAi — Android AAB (Play) ═══════════════
  # Play-signed .aab for com.foreai.mobile. Needs a `google_play` env group with:
  #   CM_KEYSTORE (base64 upload keystore), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS,
  #   CM_KEY_PASSWORD. Subscriptions use react-native-iap (native Play Billing);
  #   set EXPO_PUBLIC_IAP_LIVE=1 to switch real billing on for the build.
  foreai-android-play:
    name: ForeAi — Android AAB (Play)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      groups:
        - google_play
      vars:
        EXPO_PUBLIC_USE_FIRESTORE: "1"   # Render retired — the app runs on Firestore
        EXPO_PUBLIC_IAP_LIVE: "1"        # real subscriptions (foreai_pro_monthly/annual) via react-native-iap
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - name: Install JS dependencies
        script: |
          cd mobile
          npm install
      - name: Generate native Android project (expo prebuild)
        script: |
          cd mobile
          export ANDROID_VERSION_CODE=$((1000 + ${BUILD_NUMBER:-1}))
          echo "=================================================="
          echo "  ForeAi phone versionCode for this build: $ANDROID_VERSION_CODE"
          echo "  (must be higher than the last com.foreai.mobile upload)"
          echo "=================================================="
          npx expo prebuild --platform android --no-install
      - name: Decode the upload keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/mobile/android/app/upload.keystore"
      - name: Build the signed AAB
        script: |
          cd mobile/android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/upload.keystore" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
          V=$((1000 + ${BUILD_NUMBER:-1}))
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/ForeAi-Phone-$V.aab"
    artifacts:
      - mobile/android/app/build/outputs/**/ForeAi-Phone-*.aab
    publishing:
      email:
        recipients:
          - mpower333is@gmail.com
        notify:
          success: true
          failure: true

  # ═══════════════ 2) Kempton Park — Android AAB (Play) ═══════════════
  # Play-signed .aab for com.foreai.kempton, built from the same code with
  # EXPO_PUBLIC_CLUB=kempton (branded "Kempton Park Golf", course-locked, no
  # paywall). Reuses the shared upload keystore. Its own Play listing.
  foreai-kempton-android:
    name: Kempton Park Golf — Android AAB (Play)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      groups:
        - google_play
      vars:
        EXPO_PUBLIC_CLUB: "kempton"
        EXPO_PUBLIC_USE_FIRESTORE: "1"   # Render retired — the app runs on Firestore
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - name: Install JS dependencies
        script: |
          cd mobile
          npm install
      - name: Bundle offline satellite tiles (all 18 Kempton holes)
        script: |
          # Regenerates mobile/src/data/satTiles.ts so the whole course ships
          # offline in the bundle. Retries each tile; a hole still missing after
          # retries is a warning (app falls back to live imagery), never a build
          # failure — so a flaky tile server can't block a release.
          node scripts/fetch-sat-tiles.mjs
      - name: Generate native Android project (expo prebuild)
        script: |
          cd mobile
          export ANDROID_VERSION_CODE=$((2000 + ${BUILD_NUMBER:-1}))
          echo "=================================================="
          echo "  Kempton versionCode for this build: $ANDROID_VERSION_CODE"
          echo "  (package com.foreai.kempton — its own 2000+ lane)"
          echo "=================================================="
          npx expo prebuild --platform android --no-install
      - name: Decode the upload keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/mobile/android/app/upload.keystore"
      - name: Build the signed AAB
        script: |
          cd mobile/android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/app/upload.keystore" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
          V=$((2000 + ${BUILD_NUMBER:-1}))
          mv app/build/outputs/bundle/release/app-release.aab "app/build/outputs/bundle/release/ForeAi-Kempton-$V.aab"
    artifacts:
      - mobile/android/app/build/outputs/**/ForeAi-Kempton-*.aab
    publishing:
      email:
        recipients:
          - mpower333is@gmail.com
        notify:
          success: true
          failure: true

  # ═══════════════ 3) ForeAi — iOS (TestFlight) ═══════════════
  foreai-ios:
    name: ForeAi — iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: ForeAi ASC
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.foreai.mobile"
        EXPO_PUBLIC_USE_FIRESTORE: "1"   # Render retired — the app runs on Firestore
        # ── Apple Watch companion (see targets/watch/) ──
        # Uncomment BOTH to build the watchOS app into this IPA (rides the same
        # TestFlight/App Store submission). Verify the generated watch bundle id
        # matches WATCH_BUNDLE_ID on the first build.
        # EXPO_PUBLIC_WATCH: "1"
        # WATCH_BUNDLE_ID: "com.foreai.mobile.watch"
    scripts:
      - name: Install JS dependencies
        script: |
          cd mobile
          npm install
      - name: Generate native iOS project (expo prebuild)
        script: |
          cd mobile
          npx expo prebuild --platform ios --no-install
      - name: Patch Podfile for Xcode 26 (build fmt as C++17)
        script: |
          cd mobile/ios
          if ! grep -q "ci-fmt-cxx17-fix" Podfile; then
            awk '
              /post_install do \|installer\|/ && !done {
                print
                print "    # ci-fmt-cxx17-fix: fmt fails on Xcode 26 (consteval); build it as C++17."
                print "    installer.pods_project.targets.each do |t|"
                print "      if t.name == \"fmt\""
                print "        t.build_configurations.each do |c|"
                print "          c.build_settings[\"CLANG_CXX_LANGUAGE_STANDARD\"] = \"c++17\""
                print "          d = c.build_settings[\"GCC_PREPROCESSOR_DEFINITIONS\"] || [\"$(inherited)\"]"
                print "          d = [d] unless d.is_a?(Array)"
                print "          d << \"FMT_USE_CONSTEVAL=0\" unless d.include?(\"FMT_USE_CONSTEVAL=0\")"
                print "          c.build_settings[\"GCC_PREPROCESSOR_DEFINITIONS\"] = d"
                print "          f = c.build_settings[\"OTHER_CPLUSPLUSFLAGS\"] || [\"$(inherited)\"]"
                print "          f = [f] unless f.is_a?(Array)"
                print "          f << \"-DFMT_USE_CONSTEVAL=0\" unless f.include?(\"-DFMT_USE_CONSTEVAL=0\")"
                print "          c.build_settings[\"OTHER_CPLUSPLUSFLAGS\"] = f"
                print "        end"
                print "      end"
                print "    end"
                done=1
                next
              }
              { print }
            ' Podfile > Podfile.new && mv Podfile.new Podfile
            echo "PATCHED Podfile with fmt C++17 fix"
          else
            echo "fmt C++17 fix already present"
          fi
          echo "----- Podfile fmt section -----"
          grep -n "ci-fmt-cxx17-fix\|CLANG_CXX_LANGUAGE_STANDARD\|FMT_USE_CONSTEVAL" Podfile || echo "NONE"
      - name: Install CocoaPods
        script: |
          cd mobile/ios
          pod install
      - name: Disable fmt consteval for Xcode 26
        script: |
          cd mobile/ios
          echo "fmt consteval BEFORE:"; grep -rn "define FMT_USE_CONSTEVAL" Pods/fmt 2>/dev/null || echo "(none)"
          find Pods/fmt -type f \( -name "*.h" -o -name "*.cc" \) -exec sed -i '' 's/define FMT_USE_CONSTEVAL 1/define FMT_USE_CONSTEVAL 0/g' {} + 2>/dev/null || \
            find Pods/fmt -type f \( -name "*.h" -o -name "*.cc" \) -exec sed -i 's/define FMT_USE_CONSTEVAL 1/define FMT_USE_CONSTEVAL 0/g' {} +
          echo "fmt consteval AFTER:"; grep -rn "define FMT_USE_CONSTEVAL" Pods/fmt 2>/dev/null || echo "(none)"
      - name: Set up code signing (creates the cert + profile if missing)
        script: |
          set -e
          keychain initialize
          if [ -z "$IOS_DIST_KEY" ]; then
            echo "ERROR: IOS_DIST_KEY is not set in the ios_signing env group."
            echo "Every build would create a new distribution certificate and revoke"
            echo "the last one, so previously-uploaded builds fail ITMS-90035 Invalid"
            echo "Signature. Set IOS_DIST_KEY (base64 of a PKCS#8 distribution private"
            echo "key) as a SECURE env var in the ios_signing group, then rebuild once."
            exit 1
          fi
          CERT_KEY=/tmp/ios_distribution_key.pem
          echo "$IOS_DIST_KEY" | openssl base64 -d -A > "$CERT_KEY"
          echo "Private key: $(wc -c < "$CERT_KEY") bytes"
          openssl pkey -in "$CERT_KEY" -noout 2>/dev/null || { echo "ERROR: IOS_DIST_KEY did not decode to a valid private key."; exit 1; }
          fetch_signing() {
            app-store-connect fetch-signing-files "$1" \
              --platform IOS \
              --type IOS_APP_STORE \
              --certificate-key=@file:"$CERT_KEY" \
              --api-server-error-retries 10 \
              --create
          }
          if ! fetch_signing "$BUNDLE_ID"; then
            echo "== Cert missing and cap reached — clearing orphaned distribution certs once =="
            app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION --json > /tmp/certs.json 2>/dev/null || true
            for CID in $(jq -r '(if type=="object" and has("data") then .data else . end)[]?.id // empty' /tmp/certs.json 2>/dev/null); do
              echo "Deleting orphaned distribution cert $CID"
              app-store-connect certificates delete "$CID" --ignore-not-found || true
            done
            fetch_signing "$BUNDLE_ID"
          fi
          # Apple Watch companion: when building the watch-inclusive IPA
          # (WATCH_BUNDLE_ID set — e.g. com.foreai.mobile.watch), also fetch its
          # App Store profile so the extra target signs with the same cert. Unset
          # by default, so normal phone builds are completely unchanged.
          if [ -n "$WATCH_BUNDLE_ID" ]; then
            fetch_signing "$WATCH_BUNDLE_ID" || echo "WARN: could not fetch signing for watch bundle $WATCH_BUNDLE_ID"
          fi
          keychain add-certificates
          cd mobile/ios
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd mobile/ios
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          cd mobile/ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          set +e
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "=================== ACTUAL COMPILER ERRORS ==================="
            grep -rhE "error:|error :" /tmp/xcodebuild_logs/ 2>/dev/null | tail -50
            echo "============================================================="
          fi
          exit $RC
      - name: Verify the IPA is distribution-signed (pre-empt ITMS-90035)
        script: |
          cd mobile/ios
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA: $IPA"
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name "*.app" | head -1)
          echo "===== codesign authorities ====="
          codesign -dvvv "$APP" 2>&1 | grep -i "^Authority=" || true
          if codesign -dvvv "$APP" 2>&1 | grep -qiE "^Authority=(Apple|iPhone) Distribution"; then
            echo "OK: IPA is distribution-signed."
          else
            echo "ERROR: IPA is NOT distribution-signed — Apple would reject it as ITMS-90035."
            echo "Check that IOS_DIST_KEY is an Apple Distribution key and use-profiles applied the App Store profile."
            exit 1
          fi
    artifacts:
      - mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - mpower333is@gmail.com
        notify:
          success: true
          failure: true

