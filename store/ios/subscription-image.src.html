<!doctype html><html><head><meta charset="utf-8"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:512px;height:512px}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#F4FBF6;
    background:radial-gradient(120% 80% at 50% 12%, rgba(141,255,107,0.22), transparent 60%),
      linear-gradient(160deg,#134E32,#0C3222 55%,#06170F);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
  .badge{width:150px;height:150px;border-radius:42px;background:linear-gradient(135deg,#FFE39A,#FFD36A,#F5B73C);
    display:flex;align-items:center;justify-content:center;font-size:82px;box-shadow:0 16px 50px rgba(0,0,0,.4);margin-bottom:26px}
  .brand{font-size:62px;font-weight:800;letter-spacing:-1.5px;line-height:1}
  .pro{display:inline-block;margin-top:14px;padding:8px 22px;border-radius:999px;
    background:linear-gradient(135deg,#B6FF8E,#8DFF6B,#46C85A);color:#052012;font-size:30px;font-weight:800;letter-spacing:2px}
  .tag{color:#C2D2C6;font-size:22px;font-weight:600;margin-top:26px;line-height:1.35;max-width:400px}
</style></head>
<body>
  <div class="badge">⛳</div>
  <div class="brand">ForeAi</div>
  <div class="pro">PRO</div>
  <div class="tag">The full AI golf toolkit — live rounds, GPS &amp; caddie</div>
</body></html>
