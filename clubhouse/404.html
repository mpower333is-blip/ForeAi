<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ForeAi — Page not found</title>
<style>
  :root{ --bg:#081226; --panel:#0F2143; --line:#26407A; --text:#F2F6FF; --faint:#7F92B6; --accent:#F3C33B; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:linear-gradient(160deg,#122C58,#081226 60%); color:var(--text); }
  .card{ max-width:520px; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:28px 24px; text-align:center; }
  .mark{ font-size:44px; }
  h1{ margin:10px 0 6px; font-size:26px; }
  p{ color:var(--faint); margin:0 0 20px; line-height:1.5; }
  .links{ display:flex; flex-direction:column; gap:10px; }
  a.btn{ display:block; text-decoration:none; border-radius:12px; padding:13px 16px; font-weight:800; }
  a.pri{ background:linear-gradient(135deg,#FBD972,#F3C33B,#D6A22A); color:#10203F; }
  a.ghost{ border:1.5px solid var(--line); color:var(--accent); }
  .hint{ color:var(--faint); font-size:12px; margin-top:16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">⛳</div>
    <h1>Page not found</h1>
    <p>That link doesn't exist. The admin tools live under <b>/manage/</b> —
      pick where you were headed:</p>
    <div class="links">
      <a class="btn pri" href="/manage/">Management portal</a>
      <a class="btn ghost" href="/manage/office.html">Office &amp; Registrations</a>
      <a class="btn ghost" href="/">ForeAi home</a>
    </div>
    <div class="hint">Tip: the admin pages are office.html, survey.html, live.html and admin.html — all under /manage/.</div>
  </div>
</body>
</html>
