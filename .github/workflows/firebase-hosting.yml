name: Deploy clubhouse to Firebase Hosting

# Auto-publishes the static clubhouse site (clubhouse/) to Firebase Hosting on
# every push to main that touches it — so the website updates itself instead of
# being re-uploaded to cPanel by hand.
#
# One-time setup in GitHub (Settings → Secrets and variables → Actions → Secrets):
#   • Secret  FIREBASE_SERVICE_ACCOUNT  the JSON key of a service account with the
#                                       "Firebase Hosting Admin" role.
# The project id is pinned below (matches .firebaserc), so no variable is needed.
# See docs/firebase-hosting.md for how to create the secret.

on:
  push:
    branches: [main]
    paths:
      - "clubhouse/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to live channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deploy action hard-fails if the service-account secret is empty, which
      # spams a failure email on every push before the secret is configured. Gate
      # the deploy on the secret being present so the run passes (deploy skipped)
      # until Firebase Hosting is actually set up. Secrets can't be read directly
      # in an `if:`, so probe it via an env var first.
      - name: Check for Firebase credentials
        id: creds
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret not set — skipping Firebase Hosting deploy. Add it in Settings → Secrets and variables → Actions to enable auto-deploy."
          fi

      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: foreai-f9cfa
          channelId: live
