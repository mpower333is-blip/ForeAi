name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast validation: typecheck the app and backend, and confirm the app bundles.
  checks:
    name: Typecheck & web build
    runs-on: ubuntu-latest
    # EXPO_PUBLIC_ vars are inlined at bundle time. Add EXPO_PUBLIC_GOLF_API_KEY
    # as a repo secret to embed online course search into the build.
    env:
      EXPO_PUBLIC_GOLF_API_KEY: ${{ secrets.EXPO_PUBLIC_GOLF_API_KEY }}
      EXPO_PUBLIC_GOLFAPI_KEY: ${{ secrets.EXPO_PUBLIC_GOLFAPI_KEY }}
      EXPO_PUBLIC_RC_IOS_KEY: ${{ secrets.EXPO_PUBLIC_RC_IOS_KEY }}
      EXPO_PUBLIC_RC_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_RC_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install app dependencies
        working-directory: mobile
        run: npm install

      - name: Typecheck app
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Web bundle
        working-directory: mobile
        run: npx expo export -p web

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Typecheck backend
        working-directory: backend
        run: |
          npx prisma generate
          npx tsc --noEmit

  # Build two standalone, installable Android APKs — the full ForeAi app and the
  # golf-day-only "ECS Golf Day" app — and upload each as its own artifact.
  android:
    name: Android APK (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, event]
    env:
      EXPO_PUBLIC_GOLF_API_KEY: ${{ secrets.EXPO_PUBLIC_GOLF_API_KEY }}
      EXPO_PUBLIC_GOLFAPI_KEY: ${{ secrets.EXPO_PUBLIC_GOLFAPI_KEY }}
      EXPO_PUBLIC_RC_IOS_KEY: ${{ secrets.EXPO_PUBLIC_RC_IOS_KEY }}
      EXPO_PUBLIC_RC_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_RC_ANDROID_KEY }}
      EXPO_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        working-directory: mobile
        run: npm install

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          # RN template signs `release` with the debug keystore → installable.
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foreai-${{ matrix.variant }}-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Publish both APKs to a single, stable "test-latest" GitHub release so the
  # download page + QR code always point at the newest build (no re-uploading).
  # Publishes from main (and the current feature branch, listed in the `if`
  # below, while it's in flight). Direct, public, no-login URLs:
  #   .../releases/download/test-latest/ECS-Golf-Day.apk
  #   .../releases/download/test-latest/ForeAi.apk
  release:
    name: Publish test APKs
    needs: [android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/android-ios-app-bridge-t69jt5'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename APKs for download
        run: |
          mkdir -p out
          cp artifacts/foreai-event-apk/*.apk "out/ECS-Golf-Day.apk"
          cp artifacts/foreai-full-apk/*.apk  "out/ForeAi.apk"
          ls -la out

      - name: Publish rolling test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-latest
          name: ForeAi — test builds (latest)
          prerelease: true
          body: |
            Latest installable test builds. Open on an Android phone **or
            tablet** and allow "install unknown apps".

            • **ECS Golf Day** — `ECS-Golf-Day.apk` (the golf-day app)
            • **ForeAi** — `ForeAi.apk` (the full app)

            Tablet install guide: docs/android-tablet.md

            iOS testing is via TestFlight (Apple requires it for beta testers).
          files: out/*.apk
