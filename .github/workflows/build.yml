name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast validation: typecheck the app and backend, and confirm the app bundles.
  checks:
    name: Typecheck & web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install app dependencies
        working-directory: mobile
        run: npm install

      - name: Typecheck app
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Web bundle
        working-directory: mobile
        run: npx expo export -p web

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Typecheck backend
        working-directory: backend
        run: |
          npx prisma generate
          npx tsc --noEmit

  # Build a standalone, installable Android APK and upload it as an artifact.
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        working-directory: mobile
        run: npm install

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          # RN template signs `release` with the debug keystore → installable.
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foreai-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
